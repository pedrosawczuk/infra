name: Deploy na VPS

# Workflow reutilizável. Cada projeto chama este arquivo com "uses:" em vez de
# repetir build, push e deploy. Veja os exemplos na pasta examples/.

on:
  workflow_call:
    inputs:
      app:
        description: Nome do app, o mesmo usado no new-app (pasta, serviço e imagem)
        required: true
        type: string
      dockerfile:
        description: Caminho do Dockerfile a partir da raiz do repositório
        required: false
        type: string
        default: Dockerfile
      context:
        description: Contexto do build
        required: false
        type: string
        default: .
      migrate:
        description: Comando de migration rodado na imagem nova antes da troca. Vazio para pular.
        required: false
        type: string
        default: ""
    secrets:
      VPS_HOST:
        required: true
      VPS_USER:
        required: true
      VPS_SSH_KEY:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ inputs.app }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Nome da imagem
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ inputs.app }}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ inputs.app }}
          cache-to: type=gha,mode=max,scope=${{ inputs.app }}

      - name: Deploy
        uses: appleboy/ssh-action@v1
        env:
          APP: ${{ inputs.app }}
          IMAGE_TAG: ${{ github.sha }}
          MIGRATE: ${{ inputs.migrate }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: APP,IMAGE_TAG,MIGRATE
          script: |
            set -eu
            export IMAGE_TAG
            cd "$HOME/komodo/apps/$APP"

            docker compose pull "$APP"

            if [ -n "$MIGRATE" ]; then
              echo "==> Rodando migration"
              docker compose run --rm "$APP" $MIGRATE
            fi

            if [ -n "$(docker compose ps -q "$APP")" ]; then
              echo "==> Troca sem downtime"
              docker rollout "$APP"
            else
              echo "==> Primeiro deploy"
              docker compose up -d --wait "$APP"
            fi

            docker image prune -f

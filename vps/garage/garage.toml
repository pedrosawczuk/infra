# Os segredos (rpc_secret, admin_token, metrics_token) não ficam aqui.
# Eles vêm das variáveis GARAGE_RPC_SECRET, GARAGE_ADMIN_TOKEN e GARAGE_METRICS_TOKEN do .env.

metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "lmdb"
metadata_fsync = true
data_fsync = true
metadata_auto_snapshot_interval = "6h"

replication_factor = 1
consistency_mode = "consistent"

rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"

[admin]
api_bind_addr = "[::]:3903"
